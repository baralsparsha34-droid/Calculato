<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator | Make it Fast</title>
    <link rel="stylesheet" href="/style.css">

</head>

<body>
    
    <header>

        <center><h1 class="main_text">Enter The Numerical Expressed to be Solved </h1></center>

    </header>

    <main>

        <div class="Main_Calc_box">

            <div class="Calc_Screen_div">

                <input type="text" id="calc_screen" readonly placeholder="0">

            </div>

            <div class="Calc_button_div">

                <div>

                    <div><button type="button" class="calc_button special" value="AC">AC</button></div>
                    <div><button type="button" class="calc_button special" value="Del">Del</button></div>
                    <div><button type="button" class="calc_button special" value="%">%</button></div>
                    <div><button type="button" class="calc_button special" value="/">/</button></div>

                </div>

                <div>

                    <div><button type="button" class="calc_button" value="7">7</button></div>
                    <div><button type="button" class="calc_button" value="8">8</button></div>
                    <div><button type="button" class="calc_button" value="9">9</button></div>
                    <div><button type="button" class="calc_button special" value="*">*</button></div>

                </div>

                <div>

                    <div><button type="button" class="calc_button" value="4">4</button></div>
                    <div><button type="button" class="calc_button" value="5">5</button></div>
                    <div><button type="button" class="calc_button" value="6">6</button></div>
                    <div><button type="button" class="calc_button special" value="-">-</button></div>

                </div>

                <div>

                    <div><button type="button" class="calc_button" value="1">1</button></div>
                    <div><button type="button" class="calc_button" value="2">2</button></div>
                    <div><button type="button" class="calc_button" value="3">3</button></div>
                    <div><button type="button" class="calc_button special" value="+">+</button></div>

                </div>

                <div>

                    <div><button type="button" class="calc_button" value="0">0</button></div>
                    <div><button type="button" class="calc_button" value=".">.</button></div>
                    <div><button type="button" class="calc_button" value="Ans">Ans</button></div>
                    <div><button type="button" class="calc_button special" value="=">=</button></div>

                </div>

            </div>

        </div>

    </main>

    <script src="/Calculato.js"></script>

</body>

</html>
